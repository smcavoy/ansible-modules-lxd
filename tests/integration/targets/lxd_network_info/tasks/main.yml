- name: Run the lxd_network_info tests
  module_defaults:
    group/smcavoy.lxd.lxd:
      url: "{{ lxd_url }}"
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      server_cert: "{{ lxd_server_cert }}"
  vars:
    run: "t-{{ lxd_run_id }}"
  block:
    - name: Create a test bridge
      smcavoy.lxd.lxd_network:
        name: "{{ run }}-br"
        config:
          ipv4.address: 10.123.45.1/24
          ipv6.address: none

    - name: Start a container on the default bridge for the leases
      smcavoy.lxd.lxd_instance:
        name: "{{ run }}-netct"
        source:
          image: "{{ lxd_image_ct }}"
        wait_for:
          - type: ipv4

    - name: "I1: list all"
      smcavoy.lxd.lxd_network_info:
      register: i1_result

    - name: "I2: one by name"
      smcavoy.lxd.lxd_network_info:
        name: "{{ run }}-br"
      register: i2_result

    - name: "I3: a missing name"
      smcavoy.lxd.lxd_network_info:
        name: no-such-net
      register: i3_result

    - name: "I4: list all in check mode"
      smcavoy.lxd.lxd_network_info:
      check_mode: true
      register: i4_result

    - name: "I1 to I4: the list holds the test object, one by name works, a missing name gives an empty list"
      ansible.builtin.assert:
        that:
          - i1_result is not changed
          - (run ~ "-br") in (i1_result.networks | map(attribute='name') | list)
          - i2_result.networks | length == 1
          - i2_result.networks[0].name == (run ~ "-br")
          - i3_result is not changed
          - i3_result.networks == []
          - i4_result is not changed
          - i4_result.networks | length == i1_result.networks | length

    - name: "NI1: read the bridge with its state"
      smcavoy.lxd.lxd_network_info:
        name: "{{ run }}-br"
        include_state: true
      register: ni1_result

    - name: "NI2: read the default bridge with its leases"
      smcavoy.lxd.lxd_network_info:
        name: lxdbr0
        include_leases: true
      register: ni2_result

    - name: "NI3: list the unmanaged interfaces too"
      smcavoy.lxd.lxd_network_info:
        managed_only: false
      register: ni3_result

    - name: "NI1 to NI3: the state is up, the leases name the container, and unmanaged interfaces appear"
      ansible.builtin.assert:
        that:
          - ni1_result.networks[0].state.state == 'up'
          - ni2_result.networks[0].leases | selectattr('hostname', 'eq', run ~ '-netct') | list | length == 1
          - ni3_result.networks | rejectattr('managed') | list | length > 0
          - i1_result.networks | rejectattr('managed') | list | length == 0
  always:
    - name: Remove the container
      smcavoy.lxd.lxd_instance:
        name: "{{ run }}-netct"
        state: absent
        force: true
      failed_when: false

    - name: Remove the test bridge
      smcavoy.lxd.lxd_network:
        name: "{{ run }}-br"
        state: absent
      failed_when: false
