- name: Run the lxd_cluster_member_info_standalone tests
  module_defaults:
    group/smcavoy.lxd.lxd:
      url: "{{ lxd_url }}"
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      server_cert: "{{ lxd_server_cert }}"
    ansible.builtin.uri:
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      ca_path: "{{ lxd_server_cert }}"
      body_format: json
      status_code: [200, 201, 202, 404]
  block:
    - name: "CMI2: read the members of a standalone server"
      smcavoy.lxd.lxd_cluster_member_info:
      register: cmi2_result

    - name: "CMI2: the server is not clustered, and the list is empty"
      ansible.builtin.assert:
        that:
          - cmi2_result is not changed
          - cmi2_result.clustered is false
          - cmi2_result.members == []
