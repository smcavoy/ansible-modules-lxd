- name: Run the lxd_instance_backup tests
  module_defaults:
    group/smcavoy.lxd.lxd:
      url: "{{ lxd_url }}"
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      server_cert: "{{ lxd_server_cert }}"
    ansible.builtin.uri:
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      ca_path: "{{ lxd_server_cert }}"
      body_format: json
      status_code: [200, 404]
  vars:
    ct: "t-{{ lxd_run_id }}-bak"
    backup_url: "{{ lxd_url }}/1.0/instances/{{ ct }}/backups/b1"
  block:
    - name: Create a stopped container
      smcavoy.lxd.lxd_instance:
        name: "{{ ct }}"
        state: stopped
        source:
          image: "{{ lxd_image_ct }}"

    - name: Make a folder for the download
      ansible.builtin.tempfile:
        state: directory
      register: bak_dir

    - name: "C1: check mode predicts a backup"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        dest: "{{ bak_dir.path }}/b1.tar.gz"
      check_mode: true
      register: c1_result

    - name: "C1: read the server"
      ansible.builtin.uri:
        url: "{{ backup_url }}"
      register: c1_server

    - name: "C1: read the download"
      ansible.builtin.stat:
        path: "{{ bak_dir.path }}/b1.tar.gz"
      register: c1_file

    - name: "C2: create and download the backup"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        instance_only: true
        compression_algorithm: gzip
        dest: "{{ bak_dir.path }}/b1.tar.gz"
      register: c2_result

    - name: "C2: read the download"
      ansible.builtin.stat:
        path: "{{ bak_dir.path }}/b1.tar.gz"
      register: c2_file

    - name: "C3: run C2 again"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        instance_only: true
        compression_algorithm: gzip
        dest: "{{ bak_dir.path }}/b1.tar.gz"
      register: c3_result

    - name: "C1 to C3: check mode does nothing, the backup and the file exist, and a second run makes no change"
      ansible.builtin.assert:
        that:
          - c1_result is changed
          - c1_server.status == 404
          - not c1_file.stat.exists
          - c2_result is changed
          - c2_result.backup.instance_only is true
          - c2_result.size > 0
          - c2_file.stat.size == c2_result.size
          - c3_result is not changed

    - name: "B1: a create-only option that differs"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        instance_only: false
        optimized_storage: true
      register: b1_result

    - name: "B2: force a new download"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        dest: "{{ bak_dir.path }}/b1.tar.gz"
        force_download: true
      register: b2_result

    - name: "B3: dest in a folder that does not exist"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        dest: /no/such/folder/b1.tar.gz
      register: b3_result
      ignore_errors: true

    - name: "B1 to B3: a warning, a forced download, and a clear error"
      ansible.builtin.assert:
        that:
          - b1_result is not changed
          - b1_result.warnings | default([]) | select('search', 'optimized_storage') | list | length == 1
          - b2_result is changed
          - b2_result.size == c2_result.size
          - b3_result is failed
          - "'directory of dest does not exist' in b3_result.msg"

    - name: "C10: check mode predicts a delete"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        state: absent
      check_mode: true
      register: c10_result

    - name: "C11: delete the backup"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        state: absent
      register: c11_result

    - name: "C11: read the server"
      ansible.builtin.uri:
        url: "{{ backup_url }}"
      register: c11_server

    - name: "C12: delete again"
      smcavoy.lxd.lxd_instance_backup:
        instance: "{{ ct }}"
        name: b1
        state: absent
      register: c12_result

    - name: "C10 to C12: check mode, delete, and no change for a second delete"
      ansible.builtin.assert:
        that:
          - c10_result is changed
          - c11_result is changed
          - c11_result.backup is none
          - c11_server.status == 404
          - c12_result is not changed
  always:
    - name: Remove the container
      smcavoy.lxd.lxd_instance:
        name: "{{ ct }}"
        state: absent
        force: true
      failed_when: false

    - name: Remove the download folder
      ansible.builtin.file:
        path: "{{ bak_dir.path }}"
        state: absent
      when: bak_dir.path is defined
