- name: Run the lxd_project tests
  module_defaults:
    group/smcavoy.lxd.lxd:
      url: "{{ lxd_url }}"
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      server_cert: "{{ lxd_server_cert }}"
    ansible.builtin.uri:
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      ca_path: "{{ lxd_server_cert }}"
      body_format: json
      status_code: [200, 404]
  vars:
    proj: "t-{{ lxd_run_id }}-proj"
    proj_url: "{{ lxd_url }}/1.0/projects/{{ proj }}"
  block:
    - name: "C1: check mode predicts a create"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        config:
          limits.instances: 5
      check_mode: true
      register: c1_result
    - name: "C1: read the server"
      ansible.builtin.uri:
        url: "{{ proj_url }}"
      register: c1_server
    - name: "C1: nothing exists yet"
      ansible.builtin.assert:
        that:
          - c1_result is changed
          - c1_server.status == 404

    - name: "C2: create the project"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        description: test project
        config:
          limits.instances: 5
      register: c2_result
    - name: "C2: the module creates the project with the default features"
      ansible.builtin.assert:
        that:
          - c2_result is changed
          - c2_result.project.config['limits.instances'] == '5'
          - c2_result.project.config['features.profiles'] == 'true'

    - name: "C3: run C2 again"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        description: test project
        config:
          limits.instances: 5
      register: c3_result
    - name: "C3: no change"
      ansible.builtin.assert:
        that:
          - c3_result is not changed

    - name: "C4: check mode predicts an update"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        config:
          limits.instances: 7
      check_mode: true
      diff: true
      register: c4_result
    - name: "C4: read the server"
      ansible.builtin.uri:
        url: "{{ proj_url }}"
      register: c4_server
    - name: "C4: only the option changes, and the server keeps the old value"
      ansible.builtin.assert:
        that:
          - c4_result is changed
          - c4_result.diff.after.config['limits.instances'] == '7'
          - c4_server.json.metadata.config['limits.instances'] == '5'

    - name: "C5: update one option"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        config:
          limits.instances: 7
      register: c5_result
    - name: "C5: read the server"
      ansible.builtin.uri:
        url: "{{ proj_url }}"
      register: c5_server
    - name: "C5: the server has the new value"
      ansible.builtin.assert:
        that:
          - c5_result is changed
          - c5_server.json.metadata.config['limits.instances'] == '7'

    - name: "C6: set a key with the API"
      ansible.builtin.uri:
        url: "{{ proj_url }}"
        method: PATCH
        body:
          config:
            user.other: set-by-api
    - name: "C6: run without the key"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        config:
          limits.instances: 7
      register: c6_result
    - name: "C6: merge keeps the key"
      ansible.builtin.assert:
        that:
          - c6_result is not changed
          - c6_result.project.config['user.other'] == 'set-by-api'

    - name: "C7: config_mode exact"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        config:
          limits.instances: 7
        config_mode: exact
      register: c7_result
    - name: "C7: exact removes the unmanaged key and keeps the computed feature keys"
      ansible.builtin.assert:
        that:
          - c7_result is changed
          - "'user.other' not in c7_result.project.config"
          - c7_result.project.config['features.profiles'] == 'true'

    - name: "C8: remove one key with null"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        config:
          limits.instances: null
      register: c8_result
    - name: "C8: the key is gone"
      ansible.builtin.assert:
        that:
          - c8_result is changed
          - "'limits.instances' not in c8_result.project.config"

    - name: "C9: a list as a config value"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        config:
          limits.instances: [1, 2]
      register: c9_result
      ignore_errors: true
    - name: "C9: bad input fails with a clear message"
      ansible.builtin.assert:
        that:
          - c9_result is failed
          - "'must be a string, a number, or a boolean' in c9_result.msg"

    - name: "P2: a create-only option on an existing project gives a warning"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        default_storage_pool: "{{ lxd_pool }}"
      register: p2_result
    - name: "P2: no change, one warning"
      ansible.builtin.assert:
        that:
          - p2_result is not changed
          - p2_result.warnings | select('search', 'applies only on create') | list | length == 1

    - name: "P4: put a profile into the project"
      ansible.builtin.uri:
        url: "{{ lxd_url }}/1.0/profiles?project={{ proj }}"
        method: POST
        body:
          name: extra
        status_code: [200, 201]
    - name: "P4: a delete without force_delete fails"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        state: absent
      register: p4_result
      ignore_errors: true
    - name: "P4: the message names force_delete"
      ansible.builtin.assert:
        that:
          - p4_result is failed
          - "'force_delete' in p4_result.msg"

    - name: "C10: check mode predicts a delete"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        state: absent
        force_delete: true
      check_mode: true
      register: c10_result
    - name: "C10: read the server"
      ansible.builtin.uri:
        url: "{{ proj_url }}"
      register: c10_server
    - name: "C10: the project still exists"
      ansible.builtin.assert:
        that:
          - c10_result is changed
          - c10_server.status == 200

    - name: "C11: delete the project and its profile"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        state: absent
        force_delete: true
      register: c11_result
    - name: "C11: read the server"
      ansible.builtin.uri:
        url: "{{ proj_url }}"
      register: c11_server
    - name: "C11: the project is gone"
      ansible.builtin.assert:
        that:
          - c11_result is changed
          - c11_server.status == 404

    - name: "C12: delete again"
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        state: absent
      register: c12_result
    - name: "C12: no change"
      ansible.builtin.assert:
        that:
          - c12_result is not changed

    - name: "P5: the module refuses to delete the default project"
      smcavoy.lxd.lxd_project:
        name: default
        state: absent
      register: p5_result
      ignore_errors: true
    - name: "P5: the message is clear"
      ansible.builtin.assert:
        that:
          - p5_result is failed
          - "'default project cannot be deleted' in p5_result.msg"
  always:
    - name: Remove the test project
      smcavoy.lxd.lxd_project:
        name: "{{ proj }}"
        state: absent
        force_delete: true
      failed_when: false
