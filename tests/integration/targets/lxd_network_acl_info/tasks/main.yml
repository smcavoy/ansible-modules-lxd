- name: Run the lxd_network_acl_info tests
  module_defaults:
    group/smcavoy.lxd.lxd:
      url: "{{ lxd_url }}"
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      server_cert: "{{ lxd_server_cert }}"
  vars:
    run: "t-{{ lxd_run_id }}"
  block:
    - name: Create a test ACL
      smcavoy.lxd.lxd_network_acl:
        name: "{{ run }}-acl"
        ingress:
          - action: allow
            protocol: tcp
            destination_port: "22"

    - name: "I1: list all"
      smcavoy.lxd.lxd_network_acl_info:
      register: i1_result

    - name: "I2: one by name"
      smcavoy.lxd.lxd_network_acl_info:
        name: "{{ run }}-acl"
      register: i2_result

    - name: "I3: a missing name"
      smcavoy.lxd.lxd_network_acl_info:
        name: no-such-acl
      register: i3_result

    - name: "I4: list all in check mode"
      smcavoy.lxd.lxd_network_acl_info:
      check_mode: true
      register: i4_result

    - name: "I1 to I4: the list holds the test object, one by name works, a missing name gives an empty list"
      ansible.builtin.assert:
        that:
          - i1_result is not changed
          - (run ~ "-acl") in (i1_result.acls | map(attribute='name') | list)
          - i2_result.acls | length == 1
          - i2_result.acls[0].name == (run ~ "-acl")
          - i3_result is not changed
          - i3_result.acls == []
          - i4_result is not changed
          - i4_result.acls | length == i1_result.acls | length

    - name: "I2: the ACL has its rule"
      ansible.builtin.assert:
        that:
          - i2_result.acls[0].ingress[0].destination_port == '22'
  always:
    - name: Remove the test ACL
      smcavoy.lxd.lxd_network_acl:
        name: "{{ run }}-acl"
        state: absent
      failed_when: false
