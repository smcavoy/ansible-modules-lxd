- name: Run the lxd_network_forward tests
  module_defaults:
    group/smcavoy.lxd.lxd:
      url: "{{ lxd_url }}"
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      server_cert: "{{ lxd_server_cert }}"
    ansible.builtin.uri:
      client_cert: "{{ lxd_client_cert }}"
      client_key: "{{ lxd_client_key }}"
      ca_path: "{{ lxd_server_cert }}"
      body_format: json
      status_code: [200, 201, 202, 404]
  vars:
    fwd_net: "tb{{ lxd_run_id }}f"
    fwd_subnet: "10.{{ 200 + (lxd_slot | int) }}.0"
    fwd_url: "{{ lxd_url }}/1.0/networks/tb{{ lxd_run_id }}f/forwards/{{ lxd_sandbox_ip }}"
    fwd_subnet6: "fd42:{{ 200 + (lxd_slot | int) }}"
    fwd_listen6: "2001:db8::{{ 200 + (lxd_slot | int) }}"
  block:
    - name: "Create the bridge for the forward"
      smcavoy.lxd.lxd_network:
        name: "{{ fwd_net }}"
        config:
          ipv4.address: "{{ fwd_subnet }}.1/24"
          ipv4.nat: true
          ipv6.address: "{{ fwd_subnet6 }}::1/64"
    - name: "C1: check mode predicts a create"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        description: "first"
        ports:
          - protocol: "tcp"
            listen_port: "8081"
            target_address: "{{ fwd_subnet }}.10"
            target_port: "80"
          - protocol: "udp"
            listen_port: "5353"
            target_address: "{{ fwd_subnet }}.11"
      check_mode: true
      register: c1_result
    - name: "C1: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c1_server
    - name: "C1: nothing exists yet"
      ansible.builtin.assert:
        that:
          - c1_result is changed
          - c1_server.status == 404
    - name: "C2: create"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        description: "first"
        ports:
          - protocol: "tcp"
            listen_port: "8081"
            target_address: "{{ fwd_subnet }}.10"
            target_port: "80"
          - protocol: "udp"
            listen_port: "5353"
            target_address: "{{ fwd_subnet }}.11"
      register: c2_result
    - name: "C2: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c2_server
    - name: "C2: the module creates it"
      ansible.builtin.assert:
        that:
          - c2_result is changed
          - c2_server.status == 200
          - c2_server.json.metadata.ports | length == 2
    - name: "C3: run C2 again"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        description: "first"
        ports:
          - protocol: "tcp"
            listen_port: "8081"
            target_address: "{{ fwd_subnet }}.10"
            target_port: "80"
          - protocol: "udp"
            listen_port: "5353"
            target_address: "{{ fwd_subnet }}.11"
      register: c3_result
    - name: "C3: no change"
      ansible.builtin.assert:
        that:
          - c3_result is not changed
    - name: "C4: check mode predicts an update"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        description: "second"
      check_mode: true
      diff: true
      register: c4_result
    - name: "C4: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c4_server
    - name: "C4: change predicted, server unchanged"
      ansible.builtin.assert:
        that:
          - c4_result is changed
          - c4_result.diff.before != c4_result.diff.after
          - c4_server.json.metadata.description == 'first'
    - name: "C5: update one option"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        description: "second"
      register: c5_result
    - name: "C5: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c5_server
    - name: "C5: the server has the new value"
      ansible.builtin.assert:
        that:
          - c5_result is changed
          - c5_server.json.metadata.description == 'second'
    # LXD 6.10.1 resets the description on a PATCH without it, so the PATCH sends it again.
    - name: "C6: set a key with the API"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
        method: PATCH
        body:
          description: "second"
          config:
            user.other: "set-by-api"
    - name: "C6: run without the key"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        description: "second"
      register: c6_result
    - name: "C6: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c6_server
    - name: "C6: merge keeps the key"
      ansible.builtin.assert:
        that:
          - c6_result is not changed
          - c6_server.json.metadata.config['user.other'] == 'set-by-api'
    - name: "C7: config_mode exact"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        description: "second"
        config: {}
        config_mode: "exact"
      register: c7_result
    - name: "C7: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c7_server
    - name: "C7: exact removes the unmanaged key"
      ansible.builtin.assert:
        that:
          - c7_result is changed
          - "'user.other' not in c7_server.json.metadata.config"
    - name: "C8: set a key"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        config:
          user.temp: "1"
      register: c8a_result
    - name: "C8: remove it with null"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        config:
          user.temp: null
      register: c8_result
    - name: "C8: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c8_server
    - name: "C8: null removes the key"
      ansible.builtin.assert:
        that:
          - c8_result is changed
          - "'user.temp' not in c8_server.json.metadata.config"
    - name: "C9: bad input"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        ports:
          - protocol: "tcp"
            listen_port: "8082"
      register: c9_result
      ignore_errors: true
    - name: "C9: bad input fails with a clear message"
      ansible.builtin.assert:
        that:
          - c9_result is failed
          - '"missing required arguments" in c9_result.msg'
    - name: "F1: the same ports in another order"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        ports:
          - protocol: "udp"
            listen_port: "5353"
            target_address: "{{ fwd_subnet }}.11"
          - protocol: "tcp"
            listen_port: "8081"
            target_address: "{{ fwd_subnet }}.10"
            target_port: "80"
      register: f1_result
    - name: "F1: no change, and a missing target_port equals listen_port"
      ansible.builtin.assert:
        that:
          - f1_result is not changed
    - name: "F2: an IPv6 forward whose addresses are not in the canonical form, two times"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ fwd_listen6 | replace('::', ':0:0::') | upper }}"
        config:
          target_address: "{{ fwd_subnet6 | upper }}:0::0010"
        ports:
          - protocol: "tcp"
            listen_port: "80"
            target_address: "{{ fwd_subnet6 | upper }}:0:0::0011"
      register: f2_result
      loop: [1, 2]
    - name: "F2: read the server"
      ansible.builtin.uri:
        url: "{{ lxd_url }}/1.0/networks/{{ fwd_net }}/forwards/{{ fwd_listen6 }}"
      register: f2_server
    - name: "F2: LXD stores the canonical form, and the second run makes no change"
      ansible.builtin.assert:
        that:
          - f2_result.results | map(attribute='changed') | list == [true, false]
          - f2_server.json.metadata.listen_address == fwd_listen6
          - f2_server.json.metadata.config.target_address == fwd_subnet6 ~ '::10'
          - f2_server.json.metadata.ports[0].target_address == fwd_subnet6 ~ '::11'
    - name: "F3: the unspecified address"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ item.listen }}"
        config: "{{ item.config }}"
      register: f3_result
      ignore_errors: true
      loop:
        - {listen: "0.0.0.0", config: {}}
        - {listen: "::", config: {}}
        - {listen: "192.0.2.77", config: {target_address: "0.0.0.0"}}
    - name: "F3: read the forwards"
      ansible.builtin.uri:
        url: "{{ lxd_url }}/1.0/networks/{{ fwd_net }}/forwards"
      register: f3_server
    - name: "F3: the module refuses it and creates nothing"
      ansible.builtin.assert:
        that:
          - f3_result.results | map(attribute='failed') | list == [true, true, true]
          - f3_result.results | map(attribute='msg') | select('search', 'unspecified address') | list | length == 3
          - "'listen_address' in f3_result.results[0].msg"
          - "'config.target_address' in f3_result.results[2].msg"
          - f3_server.json.metadata | length == 2
    - name: "C10: check mode predicts a delete"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        state: "absent"
      check_mode: true
      register: c10_result
    - name: "C10: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c10_server
    - name: "C10: it still exists"
      ansible.builtin.assert:
        that:
          - c10_result is changed
          - c10_server.status == 200
    - name: "C11: delete"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        state: "absent"
      register: c11_result
    - name: "C11: read the server"
      ansible.builtin.uri:
        url: "{{ fwd_url }}"
      register: c11_server
    - name: "C11: it is gone"
      ansible.builtin.assert:
        that:
          - c11_result is changed
          - c11_server.status == 404
    - name: "C12: delete again"
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        state: "absent"
      register: c12_result
    - name: "C12: no change"
      ansible.builtin.assert:
        that:
          - c12_result is not changed
  always:
    - name: Remove the test object
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ lxd_sandbox_ip }}"
        state: "absent"
      failed_when: false
    - name: Remove the IPv6 forward
      smcavoy.lxd.lxd_network_forward:
        network: "{{ fwd_net }}"
        listen_address: "{{ fwd_listen6 }}"
        state: "absent"
      failed_when: false
    - name: Remove the bridge
      smcavoy.lxd.lxd_network:
        name: "{{ fwd_net }}"
        state: absent
      failed_when: false
