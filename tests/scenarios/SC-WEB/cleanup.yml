# Delete in reverse order of creation. A failure here must not hide the real failure.
- name: Remove the forward
  smcavoy.lxd.lxd_network_forward:
    network: "{{ web_bridge }}"
    listen_address: "{{ lxd_sandbox_ip }}"
    state: absent
  failed_when: false

- name: Remove the container
  smcavoy.lxd.lxd_instance:
    name: web1
    project: "{{ web_project }}"
    state: absent
    force: true
  failed_when: false

- name: Remove the project and its contents
  smcavoy.lxd.lxd_project:
    name: "{{ web_project }}"
    state: absent
    force_delete: true
  failed_when: false

- name: Remove the bridge
  smcavoy.lxd.lxd_network:
    name: "{{ web_bridge }}"
    state: absent
  failed_when: false
