line-length = 160
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["UP007"]

[lint.per-file-ignores]
# Modules keep their imports after DOCUMENTATION, EXAMPLES, and RETURN.
"**/plugins/modules/*.py" = ["E402"]
