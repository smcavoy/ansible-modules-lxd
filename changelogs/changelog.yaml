ancestor: null
releases:
  0.1.0:
    changes:
      bugfixes:
      - all modules - ``state=absent`` with a project that does not exist now fails
        and names the project, instead of reporting the object as absent. A missing
        parent object gives a warning.
      - all modules - a connection error, such as a wrong ``server_fingerprint``,
        now shows its text and not a Python tuple.
      - all modules - an LXD operation longer than 60 seconds no longer fails with
        ``context deadline exceeded``. The wait goes on until ``timeout``, also through
        short connection breaks, and a timeout says that the operation can still run.
      - all modules - check mode no longer uses up a one-time ``trust_token``.
      - 'all modules - the wait for an operation now goes on while LXD restarts. Before,
        the HTTP 500 that LXD sends during its shutdown (``sql: database is closed``)
        failed the task at once.'
      - all modules - the wait for an operation now keeps to ``timeout`` when the
        connection to LXD hangs. Before, each read retry waited a full socket timeout,
        so a 40 second timeout could run more than 2 minutes.
      - all modules - when LXD no longer knows an operation after a connection break,
        the error now says that the operation can have finished during the break and
        that its result is unknown.
      - all modules - when two runs create the same object at the same time, the second
        run no longer fails with ``already exists``. It reads the object again once
        and updates it if needed.
      - lxd_instance_backup, lxd_storage_volume_backup, lxd_image_export, lxd_image
        - backups and images are now streamed to and from disk in 1 MiB chunks, not
        held whole in controller memory. A download broken by a connection reset starts
        the file again.
      - lxd_instance_exec - when LXD restarts or the connection breaks during the
        command, the error now says that the command can still run in the instance,
        or that it ran, and that a new run of the task runs it again. Before, it said
        to run the task again.
      - lxd_instance_file - ``owner_uid``, ``owner_gid`` and ``mode`` now keep the
        values of an existing path when the task does not set them. Before, a task
        that set only ``content`` changed the file to root and ``0644``.
      - lxd_instance_file - a file that root in the instance does not own and that
        gives no write to others (for example ``0600`` owned by uid 1000) can now
        be changed. LXD refuses that overwrite with 403, so the module deletes the
        file and writes it again. The inode changes, so hard links to the file break.
      - lxd_instance_file - files are now streamed. The file in the instance is read
        into a temporary file for the SHA-256 compare, and uploads (of ``src``, and
        a write again for an owner or mode change) stream from disk, so a large file
        does not need controller memory.
      release_summary: 'The first release of ``smcavoy.lxd``: 63 modules for the LXD
        6.10 REST API, with no Python dependency outside ansible-core. Tested against
        LXD 6.10.1 on standalone servers, clusters, linked clusters and MicroCloud
        (OVN and Ceph), on ansible-core 2.19 to 2.22 and Python 3.11 to 3.13.'
    fragments:
    - 0.1.0-release.yml
    - 12-wait-deadline.yml
    - 6-create-race.yml
    - 7-instance-file-owner-mode.yml
    - 8-stream-large-files.yml
    - 9-connection-error-text.yml
    - ci-and-tests-2026-11-08.yml
    - review-2026-11-08.yml
    - server-faults.yml
    - stream-instance-file.yml
